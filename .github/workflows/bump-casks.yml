name: Bump casks

on:
  schedule:
    - cron: "17 6 1 * *"  # every first day of the month at 06:17 UTC
  workflow_dispatch:  # enable manual runs

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest  # macos-latest
    strategy:
      fail-fast: false
      matrix:
        cask: [ia-writer]  # list of casks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: setup
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check for a newer version
        id: check
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          json=$(brew livecheck --cask --json "so-cool/tap/${{ matrix.cask }}")
          echo "$json"
          echo "outdated=$(jq -r '.[0].version.outdated' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.[0].version.latest' <<<"$json")" >> "$GITHUB_OUTPUT"

      - name: Update the cask file
        if: steps.check.outputs.outdated == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          LATEST: ${{ steps.check.outputs.latest }}
          CASK: Casks/${{ matrix.cask }}.rb
          TAP: ${{ steps.setup.outputs.repository-path }}
        run: |
          brew bump-cask-pr --write-only --no-audit --no-style \
            --version "$LATEST" "so-cool/tap/${{ matrix.cask }}"
          # Bring the bumped cask over from Homebrew's copy of the tap
          # (skipped if both paths point at the same file).
          cmp -s "$TAP/$CASK" "$CASK" || cp "$TAP/$CASK" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${{ matrix.cask }} ${LATEST}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
